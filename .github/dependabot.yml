version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Majors need reading the changelog; they are done by hand
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      nextjs:
        patterns: [next, react, react-dom, "@types/react", "@types/react-dom"]
      scriptc:
        patterns: [scriptc, "@scriptc/*"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
