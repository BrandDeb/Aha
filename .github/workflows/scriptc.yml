name: scriptc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  templates:
    name: Compile templates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup zig (wasm32-wasi linker)
        uses: mlugg/setup-zig@v2

      - name: Install dependencies
        run: npm ci

      - name: Build every template (native + WASM)
        run: npm run templates:wasm

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: templates-${{ matrix.os }}
          path: dist/templates/
