name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '24'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            
            ### Features
            - {{ FEATURES }}
            
            ### Fixes
            - {{ FIXES }}
            
            ### Performance
            - {{ PERFORMANCE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: Build and Publish
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, macos, windows]
        arch: [x64, arm64]
        exclude:
          - platform: windows
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          npm run build
          mkdir -p dist/${{ matrix.platform }}-${{ matrix.arch }}
          cp -r .next dist/${{ matrix.platform }}-${{ matrix.arch }}
          cp package.json dist/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.release_id }}
          asset_path: dist/${{ matrix.platform }}-${{ matrix.arch }}.zip
          asset_name: nano-cli-studio-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    name: Notify
    needs: [create-release, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: Ilshidur/action-discord@v0.6.5
        with:
          args: "🚀 New release ${{ github.ref_name }} published!"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_TITLE: "New Release ${{ github.ref_name }}"
          SLACK_MESSAGE: "NanoCLI Studio ${{ github.ref_name }} has been released!"
