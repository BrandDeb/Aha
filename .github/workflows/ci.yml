name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check the code
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Python tests run real uv commands
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm test

  scriptc:
    name: scriptc native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile a program to a native binary and to LLVM IR
        run: |
          echo 'const x: number = 5; console.log(`x = ${x}`);' > "$RUNNER_TEMP/smoke.ts"
          npx scriptc build "$RUNNER_TEMP/smoke.ts" -o "$RUNNER_TEMP/smoke" --strip
          test "$("$RUNNER_TEMP/smoke")" = "x = 5"
          npx scriptc build "$RUNNER_TEMP/smoke.ts" --emit=llvm -o "$RUNNER_TEMP/smoke.ll"
          grep -q define "$RUNNER_TEMP/smoke.ll"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  perf:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Fails when a page's JavaScript, the editor's start-up, typing latency or memory goes over perf-budget.json
      - run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: perf-report.json
