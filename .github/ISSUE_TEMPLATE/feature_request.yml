name: Feature request
description: Something the studio should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
