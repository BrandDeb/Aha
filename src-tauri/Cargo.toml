[package]
name = "nanocli-studio"
version = "1.0.0"
description = "NanoCLI Studio for Windows and macOS"
edition = "2021"
publish = false

[lib]
name = "nanocli_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# Small and quick to start: the shell only launches the studio's server and shows it
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
